<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Join the Contribute community and stay in the conversation."
    />
    <title>Sign Up | Contribute</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="signup-page">
    <main class="signup-shell">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="/">CONTRIBUTE<span>.</span></a>
        <a class="nav-link" href="/"
          >Back to manifesto <span aria-hidden="true">↗</span></a
        >
      </nav>

      <section class="signup-layout" aria-labelledby="signup-title">
        <div>
          <p class="eyebrow">A living document / 02</p>
          <h1 id="signup-title">Take<br /><em>part.</em></h1>
          <p class="intro">
            Leave your name with the people building a more attentive, generous
            way forward.
          </p>
        </div>

        <form id="signupForm" class="signup-form">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="Jane Doe" />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            placeholder="jane@example.com"
          />

          <button type="submit" id="submitBtn">
            Sign Up <span aria-hidden="true">↗</span>
          </button>
          <div id="message" role="status" aria-live="polite"></div>
        </form>
      </section>

      <footer>
        <span>CONTRIBUTE / 2026</span>
        <span>Made for the things that matter.</span>
      </footer>
    </main>

    <script type="module" src="/src/signup.ts"></script>
  </body>
</html>
