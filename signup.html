<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account or sign in to save contribution reports across devices."
    />
    <title>Sign Up | Contribute</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="signup-page">
    <main class="signup-shell">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="/">CONTRIBUTE<span>.</span></a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-menu"
        >
          <span class="menu-label">Menu</span>
          <span class="menu-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div class="site-menu" id="site-menu">
          <a class="nav-link" href="/">Manifesto</a>
          <a class="nav-link" href="/reporting.html">Reporting</a>
          <a class="nav-link active" href="/signup.html"
            >Sign up <span aria-hidden="true">↗</span></a
          >
        </div>
      </nav>

      <section class="signup-layout" aria-labelledby="signup-title">
        <div>
          <p class="eyebrow">Your account / 02</p>
          <h1 id="signup-title">Take<br /><em>part.</em></h1>
          <p class="intro">
            Create an account to keep your contribution reports with you across
            devices.
          </p>
        </div>

        <form id="authForm" class="signup-form">
          <div class="auth-heading">
            <h2 id="authTitle">Create your account</h2>
            <p id="authSubtitle">
              Use your email and a password to get started.
            </p>
          </div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            placeholder="jane@example.com"
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            placeholder="At least 6 characters"
          />

          <button type="submit" id="authSubmitButton">
            Create account <span aria-hidden="true">↗</span>
          </button>
          <button class="auth-switch" type="button" id="authSwitchButton">
            Already have an account? Sign in
          </button>
          <div id="authMessage" role="status" aria-live="polite"></div>
        </form>
      </section>

      <footer>
        <span>CONTRIBUTE / 2026</span>
        <span>Made for the things that matter.</span>
      </footer>
    </main>

    <script type="module" src="/src/signup.ts"></script>
    <script type="module" src="/src/nav.ts"></script>
  </body>
</html>
