<!doctype html>
<!--  Sign up page, served at /signup.html: the create-account / sign-in form, handled by
      signup.ts.
      (Each page lives in src/pages/<name>/ but is served at /<name>.html; see pageFolders
      in vite.config.ts.)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account or sign in to save contribution reports across devices."
    />
    <title>Sign Up | Contribute</title>
    <link rel="icon" type="image/png" href="/images/A_icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Applies the light/dark theme before the page draws, so it doesn't flash: the saved
         choice if there is one, otherwise the visitor's system setting. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
      } catch {}
      if (theme ? theme === "light" : matchMedia("(prefers-color-scheme: light)").matches)
        document.documentElement.dataset.theme = "light";
    </script>
  </head>
  <body class="signup-page">
    <main class="signup-shell">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="/"
          ><img class="logo-dark" src="/images/Logo_white.png" alt="Contribute" /><img
            class="logo-light"
            src="/images/Logo_black.png"
            alt="Contribute"
        /></a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-menu"
        >
          <span class="menu-label">Menu</span>
          <span class="menu-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div class="site-menu" id="site-menu">
          <a class="nav-link" href="/">Manifesto</a>
          <a class="nav-link" href="/reporting.html">Reporting</a>
          <a class="nav-link" href="/integrations.html">Integrations</a>
          <a class="nav-link active" href="/signup.html"
            >Sign up <span aria-hidden="true">↗</span></a
          >
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to light mode"
          >
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <span class="theme-toggle-label">Light mode</span>
          </button>
        </div>
      </nav>

      <section class="signup-layout" aria-labelledby="signup-title">
        <div>
          <p class="eyebrow">Your account / 02</p>
          <h1 id="signup-title">Take<br /><em>part.</em></h1>
          <p class="intro">
            Create an account to keep your contribution reports with you across
            devices.
          </p>
        </div>

        <form id="authForm" class="signup-form">
          <div class="auth-heading">
            <h2 id="authTitle">Create your account</h2>
            <p id="authSubtitle">
              Use your email and a password to get started.
            </p>
          </div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="jane@example.com"
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="At least 6 characters"
          />

          <button type="submit" id="authSubmitButton">
            Create account <span aria-hidden="true">↗</span>
          </button>
          <button class="auth-switch" type="button" id="authSwitchButton">
            Already have an account? Sign in
          </button>
          <div id="authMessage" role="status" aria-live="polite"></div>
        </form>
      </section>

      <footer>
        <span>ALACREATE / 2026</span>
        <span>Made for the things that matter.</span>
      </footer>
    </main>

    <script type="module" src="/src/pages/signup/signup.ts"></script>
    <script type="module" src="/src/components/nav/navigation_bar.ts"></script>
  </body>
</html>
