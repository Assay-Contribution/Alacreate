<!doctype html>
<!--  Reporting page, served at /reporting.html: the site nav and heading. reporting.ts builds
      the side menu and timeline inside #reportingPageRoot.
      (Each page lives in src/pages/<name>/ but is served at /<name>.html; see pageFolders
      in vite.config.ts.)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A daily contribution timeline for turning intention into progress."
    />
    <title>Reporting | Contribute</title>
    <link rel="icon" type="image/png" href="/images/A_icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="reporting-body">
    <main class="timeline-page">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="/"
          ><img src="/images/Logo_white.png" alt="Contribute"
        /></a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-menu"
        >
          <span class="menu-label">Menu</span>
          <span class="menu-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div class="site-menu" id="site-menu">
          <a class="nav-link" href="/">Manifesto</a>
          <a class="nav-link active" href="/reporting.html">Reporting</a>
          <a class="nav-link" href="/integrations.html">Integrations</a>
          <a class="nav-link" href="/signup.html"
            >Sign up <span aria-hidden="true">↗</span></a
          >
        </div>
      </nav>

      <header class="timeline-page-header">
        <p class="eyebrow">A daily practice / 03</p>
        <h1>Contribution <em>Timeline</em></h1>
      </header>

      <div id="reportingPageRoot"></div>
    </main>

    <script type="module" src="/src/pages/reporting/reporting.ts"></script>
    <script type="module" src="/src/components/nav/navigation_bar.ts"></script>
  </body>
</html>
